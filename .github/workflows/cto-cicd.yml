name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: azapp-ctoinabox-esign-doc-001

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # If your build script applies DB migrations (it does on Vercel),
          # add the same variables you'll use in production as repo secrets:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Package
        run: |
          zip -qr release.zip . \
            -x ".git/*" ".github/*" ".next/cache/*" "e2e/*" "docs/*" "*.md" "release.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: release.zip
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Unzip
        run: unzip -q release.zip -d app && rm release.zip

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./app